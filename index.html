<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Meu Tabuleiro de Xadrez</title>
  <!-- Estilos oficiais do Chessground -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/chessground@9.2.1/assets/chessground.base.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/chessground@9.2.1/assets/chessground.brown.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/chessground@9.2.1/assets/chessground.cburnett.css">
  <style>
    body {
      background-color: #161512;
      color: #bababa;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      user-select: none;
    }

    .container-tabuleiro {
      position: relative;
      width: 480px;
      height: 480px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.75);
      border-radius: 3px;
      overflow: hidden;
    }

    #tabuleiro, cg-wrap {
      width: 480px;
      height: 480px;
      display: block;
    }

    /* Deixa o tabuleiro marrom clássico mais nítido e fiel */
    .brown cg-board {
      background-color: #f0d9b5;
      background-image: repeating-conic-gradient(#b58863 0% 25%, #f0d9b5 0% 50%) !important;
      background-size: 120px 120px !important;
    }

    /* Sobreposição de escolha de promoção */
    #modal-promocao {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }

    #modal-promocao.ativo {
      display: flex;
    }

    .caixa-promocao {
      background: #262421;
      border: 2px solid #4a4743;
      border-radius: 8px;
      padding: 12px;
      display: flex;
      gap: 10px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.8);
    }

    .opcao-peca {
      width: 68px;
      height: 68px;
      background: #363431;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s, background 0.15s;
    }

    .opcao-peca:hover {
      background: #524e4a;
      transform: scale(1.06);
    }

    .opcao-peca img {
      width: 56px;
      height: 56px;
    }

    .painel {
      margin-top: 16px;
      display: flex;
      gap: 12px;
      align-items: center;
    }

    button {
      background-color: #363431;
      color: #fff;
      border: 1px solid #4a4743;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }

    button:hover {
      background-color: #4a4743;
    }

    #status {
      font-weight: bold;
      min-width: 190px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="container-tabuleiro">
    <div id="tabuleiro" class="brown cburnett"></div>
    
    <!-- Janela de escolha de promoção -->
    <div id="modal-promocao">
      <div class="caixa-promocao" id="opcoes-promocao"></div>
    </div>
  </div>

  <div class="painel">
    <button onclick="reiniciarJogo()">Nova Partida</button>
    <button onclick="inverterTabuleiro()">Inverter Lado (X)</button>
    <span id="status">Vez das Brancas</span>
  </div>

  <script type="module">
    import { Chessground } from 'https://cdn.jsdelivr.net/npm/chessground@9.2.1/+esm';
    import { Chess } from 'https://cdn.jsdelivr.net/npm/chess.js@1.0.0-beta.8/+esm';

    const jogo = new Chess();
    const statusEl = document.getElementById('status');
    const modalPromocao = document.getElementById('modal-promocao');
    const opcoesPromocao = document.getElementById('opcoes-promocao');

    // Sons oficiais (repositório aberto do Lichess)
    const sons = {
      mover: new Audio('https://raw.githubusercontent.com/lichess-org/lila/master/public/sound/standard/Move.mp3'),
      capturar: new Audio('https://raw.githubusercontent.com/lichess-org/lila/master/public/sound/standard/Capture.mp3'),
      xeque: new Audio('https://raw.githubusercontent.com/lichess-org/lila/master/public/sound/standard/Check.mp3'),
      fim: new Audio('https://raw.githubusercontent.com/lichess-org/lila/master/public/sound/standard/GenericNotify.mp3')
    };

    function estaEmXeque() {
      if (typeof jogo.isCheck === 'function') return jogo.isCheck();
      if (typeof jogo.inCheck === 'function') return jogo.inCheck();
      return false;
    }

    function estaEmXequeMate() {
      if (typeof jogo.isCheckmate === 'function') return jogo.isCheckmate();
      if (typeof jogo.inCheckmate === 'function') return jogo.inCheckmate();
      return false;
    }

    function tocarSom(lance) {
      let audio = sons.mover;
      if (estaEmXequeMate() || estaEmXeque()) {
        audio = sons.xeque;
      } else if (jogo.isGameOver()) {
        audio = sons.fim;
      } else if (lance && lance.captured) {
        audio = sons.capturar;
      }
      audio.currentTime = 0;
      audio.play().catch(() => {});
    }

    function obterLancesLegais() {
      const dests = new Map();
      const colunas = 'abcdefgh';
      for (let c = 0; c < 8; c++) {
        for (let l = 1; l <= 8; l++) {
          const casa = `${colunas[c]}${l}`;
          const lances = jogo.moves({ square: casa, verbose: true });
          if (lances.length) {
            dests.set(casa, lances.map(l => l.to));
          }
        }
      }
      return dests;
    }

    function atualizarStatus() {
      if (estaEmXequeMate()) {
        statusEl.textContent = `Xeque-mate! Vitória das ${jogo.turn() === 'w' ? 'Pretas' : 'Brancas'}.`;
      } else if (jogo.isDraw()) {
        statusEl.textContent = 'Empate!';
      } else {
        const vez = jogo.turn() === 'w' ? 'Brancas' : 'Pretas';
        statusEl.textContent = `Vez das ${vez}${estaEmXeque() ? ' (Xeque!)' : ''}`;
      }
    }

    function sincronizarTabuleiro(lanceExecutado) {
      const emXeque = estaEmXeque();
      cg.set({
        fen: jogo.fen(),
        turnColor: jogo.turn() === 'w' ? 'white' : 'black',
        check: emXeque,
        movable: {
          dests: obterLancesLegais()
        }
      });
      atualizarStatus();
      if (lanceExecutado) tocarSom(lanceExecutado);
    }

    function ehPromocao(orig, dest) {
      const peca = jogo.get(orig);
      if (!peca || peca.type !== 'p') return false;
      return (peca.color === 'w' && dest[1] === '8') || (peca.color === 'b' && dest[1] === '1');
    }

    function abrirMenuPromocao(orig, dest, cor) {
      const prefixo = cor === 'w' ? 'w' : 'b';
      const pecas = [
        { codigo: 'q', img: `${prefixo}Q`, nome: 'Dama' },
        { codigo: 'r', img: `${prefixo}R`, nome: 'Torre' },
        { codigo: 'b', img: `${prefixo}B`, nome: 'Bispo' },
        { codigo: 'n', img: `${prefixo}N`, nome: 'Cavalo' }
      ];

      opcoesPromocao.innerHTML = '';
      pecas.forEach(p => {
        const btn = document.createElement('div');
        btn.className = 'opcao-peca';
        btn.title = p.nome;
        btn.innerHTML = `<img src="https://raw.githubusercontent.com/lichess-org/lila/master/public/piece/cburnett/${p.img}.svg" alt="${p.nome}">`;
        btn.onclick = () => {
          modalPromocao.classList.remove('ativo');
          const lance = jogo.move({ from: orig, to: dest, promotion: p.codigo });
          sincronizarTabuleiro(lance);
        };
        opcoesPromocao.appendChild(btn);
      });

      modalPromocao.classList.add('ativo');
    }

    const cg = Chessground(document.getElementById('tabuleiro'), {
      movable: {
        color: 'both',
        free: false,
        dests: obterLancesLegais()
      },
      drawable: {
        enabled: true,
        visible: true
      },
      events: {
        move: (orig, dest) => {
          if (ehPromocao(orig, dest)) {
            abrirMenuPromocao(orig, dest, jogo.turn());
            return;
          }
          const lance = jogo.move({ from: orig, to: dest });
          sincronizarTabuleiro(lance);
        }
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key.toLowerCase() === 'x') cg.toggleOrientation();
    });

    window.reiniciarJogo = () => {
      modalPromocao.classList.remove('ativo');
      jogo.reset();
      cg.set({
        fen: jogo.fen(),
        turnColor: 'white',
        check: false,
        lastMove: undefined,
        drawable: { shapes: [] },
        movable: { dests: obterLancesLegais() }
      });
      atualizarStatus();
    };

    window.inverterTabuleiro = () => {
      cg.toggleOrientation();
    };
  </script>

</body>
</html>
