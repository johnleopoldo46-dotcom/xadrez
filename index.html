<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Xadrez da Leopoldóvia</title>
  <!-- Estilos oficiais do Chessground -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/chessground@9.2.1/assets/chessground.base.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/chessground@9.2.1/assets/chessground.brown.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/chessground@9.2.1/assets/chessground.cburnett.css">
  <style>
    body {
      background-color: #161512;
      color: #bababa;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
      box-sizing: border-box;
      user-select: none;
    }

    .layout-principal {
      display: flex;
      gap: 18px;
      align-items: stretch;
      justify-content: center;
      flex-wrap: wrap;
    }

    .coluna-tabuleiro {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .barra-jogador {
      width: 480px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 2px 4px;
      box-sizing: border-box;
    }

    .info-lado {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nome-lado {
      font-size: 13px;
      font-weight: 600;
      color: #d6d3ce;
    }

    .lista-capturas {
      display: flex;
      align-items: center;
      gap: 1px;
      min-height: 22px;
    }

    .lista-capturas img {
      width: 20px;
      height: 20px;
      margin-right: -4px;
    }

    .vantagem {
      font-size: 13px;
      font-weight: bold;
      color: #a3a09b;
      margin-left: 8px;
    }

    .container-tabuleiro {
      position: relative;
      width: 480px;
      height: 480px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.75);
      border-radius: 3px;
      overflow: hidden;
    }

    #tabuleiro, cg-wrap {
      width: 480px;
      height: 480px;
      display: block;
    }

    /* Tabuleiro marrom clássico */
    .brown cg-board {
      background-color: #f0d9b5;
      background-image: repeating-conic-gradient(#b58863 0% 25%, #f0d9b5 0% 50%) !important;
      background-size: 120px 120px !important;
    }

    /* Sobreposição de escolha de promoção */
    #modal-promocao {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }

    #modal-promocao.ativo {
      display: flex;
    }

    .caixa-promocao {
      background: #262421;
      border: 2px solid #4a4743;
      border-radius: 8px;
      padding: 12px;
      display: flex;
      gap: 10px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.8);
    }

    .opcao-peca {
      width: 68px;
      height: 68px;
      background: #363431;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s, background 0.15s;
    }

    .opcao-peca:hover {
      background: #524e4a;
      transform: scale(1.06);
    }

    .opcao-peca img {
      width: 56px;
      height: 56px;
    }

    /* Painel lateral direito (Abertura + Lista de Lances + Controles) */
    .painel-lateral {
      width: 280px;
      height: 480px;
      margin-top: 30px;
      background-color: #211f1c;
      border: 1px solid #36332f;
      border-radius: 4px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.55);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .cabecalho-abertura {
      background-color: #292622;
      border-bottom: 1px solid #383530;
      padding: 10px 12px;
      min-height: 46px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 2px;
    }

    .eco-abertura {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.4px;
      color: #8f8b84;
      text-transform: uppercase;
    }

    .nome-abertura {
      font-size: 13px;
      font-weight: 600;
      color: #e4e1dc;
      line-height: 1.25;
    }

    /* Barra de configuração do modo e dificuldade do Stockfish */
    .barra-bot {
      background-color: #1c1a17;
      border-bottom: 1px solid #322f2b;
      padding: 7px 10px;
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .select-modo {
      background-color: #2e2b27;
      color: #e4e1dc;
      border: 1px solid #44403a;
      border-radius: 4px;
      padding: 4px 6px;
      font-size: 12px;
      cursor: pointer;
      outline: none;
    }

    .select-modo:hover {
      border-color: #5c574f;
    }

    #select-adversario {
      flex: 1;
    }

    #select-dificuldade {
      width: 84px;
    }

    .lista-lances-container {
      flex: 1;
      overflow-y: auto;
      padding: 4px 0;
    }

    .lista-lances-container::-webkit-scrollbar {
      width: 6px;
    }

    .lista-lances-container::-webkit-scrollbar-thumb {
      background: #3d3a35;
      border-radius: 3px;
    }

    .vazio-lances {
      padding: 24px 14px;
      text-align: center;
      font-size: 12px;
      color: #77736d;
    }

    .linha-lance {
      display: grid;
      grid-template-columns: 38px 1fr 1fr;
      align-items: center;
      font-size: 13px;
      padding: 2px 8px;
    }

    .linha-lance:nth-child(even) {
      background-color: #252320;
    }

    .num-lance {
      color: #77736d;
      font-size: 12px;
      padding-left: 4px;
    }

    .celula-lance {
      padding: 4px 8px;
      border-radius: 3px;
      cursor: pointer;
      color: #d0cdc7;
      font-weight: 500;
      transition: background 0.12s, color 0.12s;
    }

    .celula-lance:hover {
      background-color: #36332e;
      color: #fff;
    }

    .celula-lance.ativo {
      background-color: #4a453d;
      color: #ffffff;
      font-weight: 700;
    }

    .rodape-lateral {
      border-top: 1px solid #36332f;
      background-color: #262421;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .barra-historico {
      display: flex;
      gap: 5px;
      align-items: center;
      justify-content: center;
    }

    .btn-nav {
      background-color: #312e2a;
      color: #c7c4be;
      border: 1px solid #433f3a;
      padding: 4px 11px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      line-height: 1.2;
      transition: background 0.15s, color 0.15s;
    }

    .btn-nav:hover:not(:disabled) {
      background-color: #45413c;
      color: #fff;
    }

    .btn-nav:disabled {
      opacity: 0.35;
      cursor: default;
    }

    .contador-lance {
      font-size: 12px;
      color: #9b9790;
      min-width: 68px;
      text-align: center;
    }

    .botoes-acao {
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: center;
    }

    button.btn-acao {
      flex: 1;
      background-color: #3b4a3b;
      color: #eef2ee;
      border: 1px solid #4f634f;
      padding: 6px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      white-space: nowrap;
      transition: background-color 0.15s, border-color 0.15s;
    }

    button.btn-acao:hover {
      background-color: #495c49;
      border-color: #607860;
    }

    button.btn-icone {
      width: 32px;
      height: 30px;
      background-color: #363431;
      color: #e4e1dc;
      border: 1px solid #4a4743;
      border-radius: 4px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
      flex-shrink: 0;
      transition: transform 0.12s, background-color 0.15s, color 0.15s;
    }

    button.btn-icone:hover {
      background-color: #4a4743;
      color: #fff;
    }

    button.btn-icone:active {
      transform: scale(0.95);
    }

    button.btn-icone svg {
      width: 15px;
      height: 15px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    button.btn-desistir {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background-color: #c93b3b;
      border: 1px solid #e05353;
      color: #ffffff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.45);
      transition: transform 0.12s, background-color 0.15s, opacity 0.15s;
    }

    button.btn-desistir:hover:not(:disabled) {
      background-color: #de4545;
      transform: scale(1.07);
    }

    button.btn-desistir:active:not(:disabled) {
      transform: scale(0.96);
    }

    button.btn-desistir:disabled {
      opacity: 0.38;
      cursor: default;
      transform: none;
    }

    button.btn-desistir svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
    }

    #status {
      font-weight: bold;
      text-align: center;
      font-size: 13px;
      color: #e0ddd7;
      padding: 2px 0;
    }

    @media (max-width: 810px) {
      .painel-lateral {
        margin-top: 8px;
        width: 480px;
        height: 280px;
      }
    }
  </style>
</head>
<body>

  <div class="layout-principal">
    <!-- Coluna Esquerda: Jogadores + Tabuleiro -->
    <div class="coluna-tabuleiro">
      <!-- Barra superior (Pretas por padrão) -->
      <div class="barra-jogador" id="barra-topo">
        <div class="info-lado">
          <span class="nome-lado" id="nome-topo">Pretas</span>
          <div class="lista-capturas" id="capturas-topo"></div>
          <span class="vantagem" id="vantagem-topo"></span>
        </div>
      </div>

      <div class="container-tabuleiro">
        <div id="tabuleiro" class="brown cburnett"></div>

        <!-- Janela de escolha de promoção -->
        <div id="modal-promocao">
          <div class="caixa-promocao" id="opcoes-promocao"></div>
        </div>
      </div>

      <!-- Barra inferior (Brancas por padrão) -->
      <div class="barra-jogador" id="barra-base">
        <div class="info-lado">
          <span class="nome-lado" id="nome-base">Brancas</span>
          <div class="lista-capturas" id="capturas-base"></div>
          <span class="vantagem" id="vantagem-base"></span>
        </div>
      </div>
    </div>

    <!-- Coluna Direita: Abertura + Modo Bot + Lista de Lances + Controles -->
    <div class="painel-lateral">
      <div class="cabecalho-abertura">
        <span class="eco-abertura" id="eco-abertura">Posição Inicial</span>
        <span class="nome-abertura" id="nome-abertura">Aguardando primeiro lance</span>
      </div>

      <div class="barra-bot">
        <select id="select-adversario" class="select-modo" title="Modo de jogo">
          <option value="humano">2 Jogadores</option>
          <option value="bot-pretas">Brancas vs Bot</option>
          <option value="bot-brancas">Pretas vs Bot</option>
        </select>

        <select id="select-dificuldade" class="select-modo" title="Dificuldade do Stockfish" style="display: none;">
          <option value="facil">Fácil</option>
          <option value="medio" selected>Médio</option>
          <option value="dificil">Difícil</option>
        </select>
      </div>

      <div class="lista-lances-container" id="lista-lances-container">
        <div class="vazio-lances">Os lances da partida aparecerão aqui.</div>
      </div>

      <div class="rodape-lateral">
        <div id="status">Vez das Brancas</div>

        <div class="barra-historico">
          <button class="btn-nav" id="btn-inicio" onclick="irParaIndice(0)" title="Início (↑)">|&lt;</button>
          <button class="btn-nav" id="btn-voltar" onclick="irParaIndice(indiceVisual - 1)" title="Lance anterior (←)">&lsaquo;</button>
          <span class="contador-lance" id="contador-lance">Início</span>
          <button class="btn-nav" id="btn-avancar" onclick="irParaIndice(indiceVisual + 1)" title="Próximo lance (→)">&rsaquo;</button>
          <button class="btn-nav" id="btn-fim" onclick="irParaIndice(lancesHistorico.length)" title="Lance atual (↓)">&gt;|</button>
        </div>

        <div class="botoes-acao">
          <button class="btn-acao" onclick="reiniciarJogo()">Nova Partida</button>
          <button class="btn-icone" onclick="inverterTabuleiro()" title="Inverter lado (X)" aria-label="Inverter lado">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M7 7h11l-3-3"/>
              <path d="M18 7l-3 3"/>
              <path d="M17 17H6l3 3"/>
              <path d="M6 17l3-3"/>
            </svg>
          </button>
          <button class="btn-desistir" id="btn-desistir" onclick="desistirPartida()" title="Desistir da partida (D)" aria-label="Desistir da partida">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 3a1 1 0 0 1 1 1v1h12.2c.75 0 1.18.85.74 1.46L16.2 10.2l2.74 3.74c.44.61.01 1.46-.74 1.46H6v6a1 1 0 1 1-2 0V4a1 1 0 0 1 1-1z"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>

      { seq: 'Nf3', eco: 'A04', nome: 'Abertura Réti / Zukertort' },
      { seq: 'f4', eco: 'A02', nome: 'Abertura Bird' },
      { seq: 'b3', eco: 'A01', nome: 'Ataque Nimzowitsch-Larsen' },
      { seq: 'g3', eco: 'A00', nome: 'Abertura Benko / Fianchetto do Rei' },
      { seq: 'b4', eco: 'A00', nome: 'Abertura Sokolsky (Orangotango)' }
    ];

    let posicoesFen = [jogo.fen()];
    let lancesHistorico = [];
    let indiceVisual = 0;
    let vencedorPorDesistencia = null;

    // --- Controle do Stockfish ---
    let stockfishWorker = null;
    let stockfishPronto = false;
    let botPensando = false;
    let idSolicitacaoBot = 0;
    let timeoutBot = null;

    const NIVEIS_BOT = {
      facil: { skill: 1, depth: 2, movetime: 180, nome: 'Bot (Fácil)' },
      medio: { skill: 8, depth: 7, movetime: 450, nome: 'Bot (Médio)' },
      dificil: { skill: 20, depth: 13, movetime: 950, nome: 'Bot (Difícil)' }
    };

    function obterCorBot() {
      const modo = selectAdversario.value;
      if (modo === 'bot-pretas') return 'b';
      if (modo === 'bot-brancas') return 'w';
      return null;
    }

    async function iniciarStockfish() {
      if (stockfishWorker) return;
      const candidatos = [
        'https://cdn.jsdelivr.net/npm/stockfish.js@10.0.2/stockfish.js',
        'https://unpkg.com/stockfish.js@10.0.2/stockfish.js'
      ];

      for (const url of candidatos) {
        try {
          const resp = await fetch(url);
          if (!resp.ok) continue;
          const codigo = await resp.text();
          const blob = new Blob([codigo], { type: 'application/javascript' });
          const blobUrl = URL.createObjectURL(blob);
          const worker = new Worker(blobUrl);
          URL.revokeObjectURL(blobUrl);

          worker.onmessage = (e) => {
            const linha = typeof e.data === 'string' ? e.data : '';
            if (linha === 'uciok') {
              worker.postMessage('isready');
            } else if (linha === 'readyok') {
              stockfishPronto = true;
              verificarTurnoDoBot();
            } else if (linha.startsWith('bestmove')) {
              const partes = linha.split(/\s+/);
              const lanceUci = partes[1];
              aplicarLanceDoBot(lanceUci);
            }
          };

          stockfishWorker = worker;
          worker.postMessage('uci');
          return;
        } catch (_) {}
      }
    }

    function cancelarCalculoBot() {
      idSolicitacaoBot++;
      if (timeoutBot) {
        clearTimeout(timeoutBot);
        timeoutBot = null;
      }
      if (stockfishWorker && botPensando) {
        stockfishWorker.postMessage('stop');
      }
      botPensando = false;
    }

    function verificarTurnoDoBot() {
      const corBot = obterCorBot();
      if (!corBot) return;
      if (vencedorPorDesistencia || estaEmXequeMate(jogo)) return;
      if (typeof jogo.isDraw === 'function' && jogo.isDraw()) return;
      if (indiceVisual !== lancesHistorico.length) return;
      if (jogo.turn() !== corBot) return;
      if (botPensando) return;

      if (!stockfishWorker) {
        iniciarStockfish();
        atualizarStatus(jogo);
        return;
      }
      if (!stockfishPronto) {
        atualizarStatus(jogo);
        return;
      }

      const nivel = NIVEIS_BOT[selectDificuldade.value] || NIVEIS_BOT.medio;
      const reqId = ++idSolicitacaoBot;
      botPensando = true;
      atualizarStatus(jogo);

      timeoutBot = setTimeout(() => {
        if (reqId !== idSolicitacaoBot) return;
        const fenAtual = jogo.fen();
        stockfishWorker.postMessage(`setoption name Skill Level value ${nivel.skill}`);
        stockfishWorker.postMessage(`position fen ${fenAtual}`);
        stockfishWorker.postMessage(`go depth ${nivel.depth} movetime ${nivel.movetime}`);
      }, 240);
    }

    function aplicarLanceDoBot(lanceUci) {
      if (!botPensando) return;
      botPensando = false;

      const corBot = obterCorBot();
      if (!corBot || jogo.turn() !== corBot) {
        atualizarStatus(jogo);
        return;
      }

      if (!lanceUci || lanceUci === '(none)') {
        atualizarStatus(jogo);
        return;
      }

      const from = lanceUci.slice(0, 2);
      const to = lanceUci.slice(2, 4);
      const promotion = lanceUci.length > 4 ? lanceUci[4] : undefined;

      const lance = jogo.move({ from, to, promotion });
      if (lance) {
        registrarNovoLance(lance);
      } else {
        renderizarPosicaoVisual(null);
      }
    }

    // --- Aberturas e Histórico ---
    function detectarAbertura(ateIndice) {
      if (ateIndice === 0) {
        return { eco: 'Posição Inicial', nome: 'Aguardando primeiro lance' };
      }
      const sequenciaAtual = lancesHistorico
        .slice(0, ateIndice)
        .map(l => l.san)
        .join(' ');

      let melhorMatch = null;
      for (const item of ABERTURAS) {
        if (sequenciaAtual === item.seq || sequenciaAtual.startsWith(item.seq + ' ')) {
          if (!melhorMatch || item.seq.length > melhorMatch.seq.length) {
            melhorMatch = item;
          }
        }
      }

      if (melhorMatch) {
        return { eco: `ECO ${melhorMatch.eco}`, nome: melhorMatch.nome };
      }
      return { eco: 'Abertura Irregular', nome: `1. ${lancesHistorico[0].san}` };
    }

    function atualizarPainelAbertura(ateIndice) {
      const info = detectarAbertura(ateIndice);
      ecoEl.textContent = info.eco;
      nomeAberturaEl.textContent = info.nome;
    }

    function renderizarListaLances() {
      if (lancesHistorico.length === 0) {
        listaLancesEl.innerHTML = '<div class="vazio-lances">Os lances da partida aparecerão aqui.</div>';
        return;
      }

      let html = '';
      for (let i = 0; i < lancesHistorico.length; i += 2) {
        const numRodada = Math.floor(i / 2) + 1;
        const idxBrancas = i + 1;
        const idxPretas = i + 2;
        const lanceBrancas = lancesHistorico[i];
        const lancePretas = lancesHistorico[i + 1];

        const ativoBrancas = indiceVisual === idxBrancas ? ' ativo' : '';
        const ativoPretas = indiceVisual === idxPretas ? ' ativo' : '';

        html += `
          <div class="linha-lance">
            <span class="num-lance">${numRodada}.</span>
            <span class="celula-lance${ativoBrancas}" data-indice="${idxBrancas}" onclick="irParaIndice(${idxBrancas})">${lanceBrancas.san}</span>
            ${lancePretas
              ? `<span class="celula-lance${ativoPretas}" data-indice="${idxPretas}" onclick="irParaIndice(${idxPretas})">${lancePretas.san}</span>`
              : '<span></span>'}
          </div>
        `;
      }

      listaLancesEl.innerHTML = html;

      const celulaAtiva = listaLancesEl.querySelector('.celula-lance.ativo');
      if (celulaAtiva) {
        celulaAtiva.scrollIntoView({ block: 'nearest' });
      }
    }

    function criarAudio(nomeArquivo) {
      const el = new Audio(`${baseSom}/${nomeArquivo}`);
      el.preload = 'auto';
      return el;
    }

    const sons = {
      mover: criarAudio('Move.mp3'),
      capturar: criarAudio('Capture.mp3')
    };

    function reproduzirSom(audioBase) {
      if (!audioBase) return;
      const copia = audioBase.cloneNode();
      copia.volume = 1;
      copia.play().catch(() => {});
    }

    function estaEmXeque(instancia = jogo) {
      if (typeof instancia.isCheck === 'function' && instancia.isCheck()) return true;
      if (typeof instancia.inCheck === 'function' && instancia.inCheck()) return true;

      if (typeof instancia.board === 'function' && typeof instancia.isAttacked === 'function') {
        const corAtual = instancia.turn();
        const inimigo = corAtual === 'w' ? 'b' : 'w';
        const colunas = 'abcdefgh';
        const tabuleiro = instancia.board();
        for (let linhaIdx = 0; linhaIdx < 8; linhaIdx++) {
          for (let colIdx = 0; colIdx < 8; colIdx++) {
            const casaObj = tabuleiro[linhaIdx][colIdx];
            if (casaObj && casaObj.type === 'k' && casaObj.color === corAtual) {
              const casaNome = `${colunas[colIdx]}${8 - linhaIdx}`;
              return instancia.isAttacked(casaNome, inimigo);
            }
          }
        }
      }
      return false;
    }

    function estaEmXequeMate(instancia = jogo) {
      if (typeof instancia.isCheckmate === 'function') return instancia.isCheckmate();
      if (typeof instancia.inCheckmate === 'function') return instancia.inCheckmate();
      return false;
    }

    function tocarSom(lance) {
      if (lance && lance.captured) {
        reproduzirSom(sons.capturar);
        return;
      }
      reproduzirSom(sons.mover);
    }

    function obterLancesLegais(instancia = jogo) {
      const dests = new Map();
      const colunas = 'abcdefgh';
      for (let c = 0; c < 8; c++) {
        for (let l = 1; l <= 8; l++) {
          const casa = `${colunas[c]}${l}`;
          const lances = instancia.moves({ square: casa, verbose: true });
          if (lances.length) {
            dests.set(casa, lances.map(l => l.to));
          }
        }
      }
      return dests;
    }

    function obterRotuloJogador(cor) {
      const corBot = obterCorBot();
      const base = cor === 'w' ? 'Brancas' : 'Pretas';
      if (corBot === cor) {
        const nivel = NIVEIS_BOT[selectDificuldade.value] || NIVEIS_BOT.medio;
        return `${base} · ${nivel.nome}`;
      }
      return base;
    }

    function atualizarMaterialECapturas(instanciaVisual, ateIndice) {
      const valores = { p: 1, n: 3, b: 3, r: 5, q: 9 };
      const ordem = { q: 1, r: 2, b: 3, n: 4, p: 5 };
      const codigosImg = { p: 'P', n: 'N', b: 'B', r: 'R', q: 'Q' };

      const capturadasPelasBrancas = [];
      const capturadasPelasPretas = [];

      for (let i = 0; i < ateIndice; i++) {
        const lance = lancesHistorico[i];
        if (lance && lance.captured) {
          if (lance.color === 'w') capturadasPelasBrancas.push(lance.captured);
          else capturadasPelasPretas.push(lance.captured);
        }
      }

      capturadasPelasBrancas.sort((a, b) => ordem[a] - ordem[b]);
      capturadasPelasPretas.sort((a, b) => ordem[a] - ordem[b]);

      let pontosBrancas = 0;
      let pontosPretas = 0;
      for (const linha of instanciaVisual.board()) {
        for (const casa of linha) {
          if (casa && valores[casa.type]) {
            if (casa.color === 'w') pontosBrancas += valores[casa.type];
            else pontosPretas += valores[casa.type];
          }
        }
      }

      const diff = pontosBrancas - pontosPretas;
      const orientacao = cg ? cg.state.orientation : 'white';
      const topoEhPretas = orientacao === 'white';

      document.getElementById('nome-topo').textContent = obterRotuloJogador(topoEhPretas ? 'b' : 'w');
      document.getElementById('nome-base').textContent = obterRotuloJogador(topoEhPretas ? 'w' : 'b');

      const listaTopo = topoEhPretas ? capturadasPelasPretas : capturadasPelasBrancas;
      const corIconeTopo = topoEhPretas ? 'w' : 'b';
      const listaBase = topoEhPretas ? capturadasPelasBrancas : capturadasPelasPretas;
      const corIconeBase = topoEhPretas ? 'b' : 'w';

      document.getElementById('capturas-topo').innerHTML = listaTopo
        .map(p => `<img src="${basePeca}/${corIconeTopo}${codigosImg[p]}.svg" alt="${p}">`)
        .join('');

      document.getElementById('capturas-base').innerHTML = listaBase
        .map(p => `<img src="${basePeca}/${corIconeBase}${codigosImg[p]}.svg" alt="${p}">`)
        .join('');

      const vantagemTopo = document.getElementById('vantagem-topo');
      const vantagemBase = document.getElementById('vantagem-base');
      vantagemTopo.textContent = '';
      vantagemBase.textContent = '';

      if (diff > 0) {
        if (topoEhPretas) vantagemBase.textContent = `+${diff}`;
        else vantagemTopo.textContent = `+${diff}`;
      } else if (diff < 0) {
        if (topoEhPretas) vantagemTopo.textContent = `+${Math.abs(diff)}`;
        else vantagemBase.textContent = `+${Math.abs(diff)}`;
      }
    }

    function atualizarStatus(instanciaVisual) {
      if (vencedorPorDesistencia && indiceVisual === lancesHistorico.length) {
        const vencedorNome = vencedorPorDesistencia === 'w' ? 'Brancas' : 'Pretas';
        statusEl.textContent = `Vitória das ${vencedorNome} (desistência)`;
        btnDesistir.disabled = true;
        return;
      }

      btnDesistir.disabled = estaEmXequeMate(instanciaVisual) ||
        (typeof instanciaVisual.isDraw === 'function' && instanciaVisual.isDraw());

      if (estaEmXequeMate(instanciaVisual)) {
        statusEl.textContent = `Xeque-mate! Vitória das ${instanciaVisual.turn() === 'w' ? 'Pretas' : 'Brancas'}.`;
      } else if (typeof instanciaVisual.isDraw === 'function' && instanciaVisual.isDraw()) {
        statusEl.textContent = 'Empate!';
      } else {
        const corBot = obterCorBot();
        const vezCor = instanciaVisual.turn();
        const vez = vezCor === 'w' ? 'Brancas' : 'Pretas';
        const revisando = indiceVisual < lancesHistorico.length ? ' · Histórico' : '';

        if (!revisando && corBot && vezCor === corBot) {
          statusEl.textContent = stockfishPronto ? 'Stockfish pensando...' : 'Carregando Stockfish...';
        } else {
          statusEl.textContent = `Vez das ${vez}${estaEmXeque(instanciaVisual) ? ' (Xeque!)' : ''}${revisando}`;
        }
      }
    }

    function atualizarControlesHistorico() {
      const total = lancesHistorico.length;
      contadorLanceEl.textContent = indiceVisual === 0
        ? (total === 0 ? 'Início' : `0 / ${total}`)
        : `${indiceVisual} / ${total}`;

      document.getElementById('btn-inicio').disabled = indiceVisual <= 0;
      document.getElementById('btn-voltar').disabled = indiceVisual <= 0;
      document.getElementById('btn-avancar').disabled = indiceVisual >= total;
      document.getElementById('btn-fim').disabled = indiceVisual >= total;
    }

    function renderizarPosicaoVisual(lanceExecutado = null) {
      const fenVisual = posicoesFen[indiceVisual];
      const instanciaVisual = new Chess(fenVisual);
      const lanceAnterior = indiceVisual > 0 ? lancesHistorico[indiceVisual - 1] : null;
      const partidaEncerrada = Boolean(vencedorPorDesistencia && indiceVisual === lancesHistorico.length);

      cg.set({
        fen: fenVisual,
        turnColor: instanciaVisual.turn() === 'w' ? 'white' : 'black',
        check: estaEmXeque(instanciaVisual),
        lastMove: lanceAnterior ? [lanceAnterior.from, lanceAnterior.to] : undefined,
        movable: {
          color: partidaEncerrada ? false : 'both',
          free: false,
          dests: partidaEncerrada ? new Map() : obterLancesLegais(instanciaVisual)
        }
      });

      atualizarStatus(instanciaVisual);
      atualizarMaterialECapturas(instanciaVisual, indiceVisual);
      atualizarPainelAbertura(indiceVisual);
      renderizarListaLances();
      atualizarControlesHistorico();
      if (lanceExecutado) tocarSom(lanceExecutado);
    }

    function truncarParaIndiceVisual() {
      cancelarCalculoBot();
      if (indiceVisual < lancesHistorico.length) {
        posicoesFen = posicoesFen.slice(0, indiceVisual + 1);
        lancesHistorico = lancesHistorico.slice(0, indiceVisual);
        jogo.load(posicoesFen[indiceVisual]);
      }
      vencedorPorDesistencia = null;
    }

    function registrarNovoLance(lance) {
      if (!lance) return;
      vencedorPorDesistencia = null;
      posicoesFen.push(jogo.fen());
      lancesHistorico.push(lance);
      indiceVisual = lancesHistorico.length;
      renderizarPosicaoVisual(lance);
      verificarTurnoDoBot();
    }

    function ehPromocao(orig, dest) {
      const peca = jogo.get(orig);
      if (!peca || peca.type !== 'p') return false;
      return (peca.color === 'w' && dest[1] === '8') || (peca.color === 'b' && dest[1] === '1');
    }

    function abrirMenuPromocao(orig, dest, cor) {
      const prefixo = cor === 'w' ? 'w' : 'b';
      const pecas = [
        { codigo: 'q', img: `${prefixo}Q`, nome: 'Dama' },
        { codigo: 'r', img: `${prefixo}R`, nome: 'Torre' },
        { codigo: 'b', img: `${prefixo}B`, nome: 'Bispo' },
        { codigo: 'n', img: `${prefixo}N`, nome: 'Cavalo' }
      ];

      opcoesPromocao.innerHTML = '';
      pecas.forEach(p => {
        const btn = document.createElement('div');
        btn.className = 'opcao-peca';
        btn.title = p.nome;
        btn.innerHTML = `<img src="${basePeca}/${p.img}.svg" alt="${p.nome}">`;
        btn.onclick = () => {
          modalPromocao.classList.remove('ativo');
          const lance = jogo.move({ from: orig, to: dest, promotion: p.codigo });
          registrarNovoLance(lance);
        };
        opcoesPromocao.appendChild(btn);
      });

      modalPromocao.classList.add('ativo');
    }

    const cg = Chessground(document.getElementById('tabuleiro'), {
      movable: {
        color: 'both',
        free: false,
        dests: obterLancesLegais()
      },
      drawable: {
        enabled: true,
        visible: true
      },
      events: {
        move: (orig, dest) => {
          if (vencedorPorDesistencia) {
            renderizarPosicaoVisual(null);
            return;
          }

          const corBot = obterCorBot();
          // Impede arrastar no lugar do bot enquanto ele está pensando
          if (botPensando && indiceVisual === lancesHistorico.length) {
            renderizarPosicaoVisual(null);
            return;
          }

          if (indiceVisual < lancesHistorico.length) {
            truncarParaIndiceVisual();
          }

          // Se após voltar no histórico caiu exatamente na vez do bot, deixa o bot jogar
          if (corBot && jogo.turn() === corBot) {
            renderizarPosicaoVisual(null);
            verificarTurnoDoBot();
            return;
          }

          if (ehPromocao(orig, dest)) {
            abrirMenuPromocao(orig, dest, jogo.turn());
            return;
          }
          const lance = jogo.move({ from: orig, to: dest });
          if (!lance) {
            renderizarPosicaoVisual(null);
            return;
          }
          registrarNovoLance(lance);
        }
      }
    });

    selectAdversario.addEventListener('change', () => {
      const corBot = obterCorBot();
      selectDificuldade.style.display = corBot ? 'inline-block' : 'none';
      cancelarCalculoBot();

      if (corBot === 'w' && cg.state.orientation === 'white') {
        cg.toggleOrientation();
      } else if (corBot === 'b' && cg.state.orientation === 'black') {
        cg.toggleOrientation();
      }

      if (corBot && !stockfishWorker) {
        iniciarStockfish();
      }

      renderizarPosicaoVisual(null);
      verificarTurnoDoBot();
    });

    selectDificuldade.addEventListener('change', () => {
      renderizarPosicaoVisual(null);
      if (botPensando) {
        cancelarCalculoBot();
        verificarTurnoDoBot();
      }
    });

    window.desistirPartida = () => {
      if (vencedorPorDesistencia || estaEmXequeMate(jogo)) return;
      cancelarCalculoBot();
      modalPromocao.classList.remove('ativo');
      const corBot = obterCorBot();
      // Em modo vs Bot, clicar em desistir sempre concede vitória ao Bot
      const quemDesistiu = corBot ? (corBot === 'w' ? 'b' : 'w') : jogo.turn();
      vencedorPorDesistencia = quemDesistiu === 'w' ? 'b' : 'w';
      indiceVisual = lancesHistorico.length;
      renderizarPosicaoVisual(null);
      reproduzirSom(sons.mover);
    };

    window.irParaIndice = (novoIndice) => {
      modalPromocao.classList.remove('ativo');
      const limite = lancesHistorico.length;
      const alvo = Math.max(0, Math.min(limite, novoIndice));
      if (alvo === indiceVisual) return;
      indiceVisual = alvo;
      renderizarPosicaoVisual(null);
      if (alvo === limite) {
        verificarTurnoDoBot();
      }
    };

    document.addEventListener('keydown', (e) => {
      const tag = document.activeElement ? document.activeElement.tagName : '';
      if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;

      if (e.key === 'ArrowLeft') {
        e.preventDefault();
        window.irParaIndice(indiceVisual - 1);
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        window.irParaIndice(indiceVisual + 1);
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        window.irParaIndice(0);
      } else if (e.key === 'ArrowDown') {
        e.preventDefault();
        window.irParaIndice(lancesHistorico.length);
      } else if (e.key.toLowerCase() === 'x') {
        window.inverterTabuleiro();
      } else if (e.key.toLowerCase() === 'd') {
        window.desistirPartida();
      }
    });

    window.reiniciarJogo = () => {
      cancelarCalculoBot();
      modalPromocao.classList.remove('ativo');
      jogo.reset();
      posicoesFen = [jogo.fen()];
      lancesHistorico = [];
      indiceVisual = 0;
      vencedorPorDesistencia = null;
      cg.set({
        fen: jogo.fen(),
        turnColor: 'white',
        check: false,
        lastMove: undefined,
        drawable: { shapes: [] },
        movable: {
          color: 'both',
          dests: obterLancesLegais()
        }
      });
      atualizarStatus(jogo);
      atualizarMaterialECapturas(jogo, 0);
      atualizarPainelAbertura(0);
      renderizarListaLances();
      atualizarControlesHistorico();
      verificarTurnoDoBot();
    };

    window.inverterTabuleiro = () => {
      cg.toggleOrientation();
      renderizarPosicaoVisual(null);
    };

    atualizarControlesHistorico();
  </script>

</body>
</html>
