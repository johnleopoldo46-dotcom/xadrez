<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Xadrez da Leopoldóvia</title>
  <!-- Estilos oficiais do Chessground -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/chessground@9.2.1/assets/chessground.base.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/chessground@9.2.1/assets/chessground.brown.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/chessground@9.2.1/assets/chessground.cburnett.css">
  <style>
    body {
      background-color: #161512;
      color: #bababa;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      user-select: none;
    }

    .barra-jogador {
      width: 480px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 2px 4px;
      box-sizing: border-box;
    }

    .info-lado {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nome-lado {
      font-size: 13px;
      font-weight: 600;
      color: #d6d3ce;
    }

    .lista-capturas {
      display: flex;
      align-items: center;
      gap: 1px;
      min-height: 22px;
    }

    .lista-capturas img {
      width: 20px;
      height: 20px;
      margin-right: -4px;
    }

    .vantagem {
      font-size: 13px;
      font-weight: bold;
      color: #a3a09b;
      margin-left: 8px;
    }

    .container-tabuleiro {
      position: relative;
      width: 480px;
      height: 480px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.75);
      border-radius: 3px;
      overflow: hidden;
    }

    #tabuleiro, cg-wrap {
      width: 480px;
      height: 480px;
      display: block;
    }

    /* Tabuleiro marrom clássico */
    .brown cg-board {
      background-color: #f0d9b5;
      background-image: repeating-conic-gradient(#b58863 0% 25%, #f0d9b5 0% 50%) !important;
      background-size: 120px 120px !important;
    }

    /* Sobreposição de escolha de promoção */
    #modal-promocao {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }

    #modal-promocao.ativo {
      display: flex;
    }

    .caixa-promocao {
      background: #262421;
      border: 2px solid #4a4743;
      border-radius: 8px;
      padding: 12px;
      display: flex;
      gap: 10px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.8);
    }

    .opcao-peca {
      width: 68px;
      height: 68px;
      background: #363431;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s, background 0.15s;
    }

    .opcao-peca:hover {
      background: #524e4a;
      transform: scale(1.06);
    }

    .opcao-peca img {
      width: 56px;
      height: 56px;
    }

    .barra-historico {
      margin-top: 10px;
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .btn-nav {
      background-color: #252320;
      color: #c7c4be;
      border: 1px solid #3c3935;
      padding: 4px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      line-height: 1.2;
      transition: background 0.15s, color 0.15s;
    }

    .btn-nav:hover:not(:disabled) {
      background-color: #3a3733;
      color: #fff;
    }

    .btn-nav:disabled {
      opacity: 0.35;
      cursor: default;
    }

    .contador-lance {
      font-size: 12px;
      color: #8f8c86;
      min-width: 74px;
      text-align: center;
    }

    .painel {
      margin-top: 10px;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
    }

    button.btn-acao {
      background-color: #363431;
      color: #fff;
      border: 1px solid #4a4743;
      padding: 7px 14px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
    }

    button.btn-acao:hover {
      background-color: #4a4743;
    }

    #status {
      font-weight: bold;
      min-width: 175px;
      text-align: center;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <!-- Barra superior (Pretas por padrão) -->
  <div class="barra-jogador" id="barra-topo">
    <div class="info-lado">
      <span class="nome-lado" id="nome-topo">Pretas</span>
      <div class="lista-capturas" id="capturas-topo"></div>
      <span class="vantagem" id="vantagem-topo"></span>
    </div>
  </div>

  <div class="container-tabuleiro">
    <div id="tabuleiro" class="brown cburnett"></div>

    <!-- Janela de escolha de promoção -->
    <div id="modal-promocao">
      <div class="caixa-promocao" id="opcoes-promocao"></div>
    </div>
  </div>

  <!-- Barra inferior (Brancas por padrão) -->
  <div class="barra-jogador" id="barra-base">
    <div class="info-lado">
      <span class="nome-lado" id="nome-base">Brancas</span>
      <div class="lista-capturas" id="capturas-base"></div>
      <span class="vantagem" id="vantagem-base"></span>
    </div>
  </div>

  <!-- Setas discretas para navegar pelos lances passados -->
  <div class="barra-historico">
    <button class="btn-nav" id="btn-inicio" onclick="irParaIndice(0)" title="Início (↑)">|&lt;</button>
    <button class="btn-nav" id="btn-voltar" onclick="irParaIndice(indiceVisual - 1)" title="Lance anterior (←)">&lsaquo;</button>
    <span class="contador-lance" id="contador-lance">Início</span>
    <button class="btn-nav" id="btn-avancar" onclick="irParaIndice(indiceVisual + 1)" title="Próximo lance (→)">&rsaquo;</button>
    <button class="btn-nav" id="btn-fim" onclick="irParaIndice(lancesHistorico.length)" title="Lance atual (↓)">&gt;|</button>
  </div>

  <div class="painel">
    <button class="btn-acao" onclick="reiniciarJogo()">Nova Partida</button>
    <button class="btn-acao" onclick="inverterTabuleiro()">Inverter Lado (X)</button>
    <span id="status">Vez das Brancas</span>
  </div>

  <script type="module">
    import { Chessground } from 'https://cdn.jsdelivr.net/npm/chessground@9.2.1/+esm';
    import { Chess } from 'https://cdn.jsdelivr.net/npm/chess.js@1.0.0-beta.8/+esm';

    const jogo = new Chess();
    const statusEl = document.getElementById('status');
    const modalPromocao = document.getElementById('modal-promocao');
    const opcoesPromocao = document.getElementById('opcoes-promocao');
    const contadorLanceEl = document.getElementById('contador-lance');

    const baseSom = 'https://cdn.jsdelivr.net/gh/lichess-org/lila@master/public/sound/standard';
    const basePeca = 'https://raw.githubusercontent.com/lichess-org/lila/master/public/piece/cburnett';

    // Armazena a linha do tempo completa: posicoes[0] é a posição inicial
    let posicoesFen = [jogo.fen()];
    let lancesHistorico = [];
    let indiceVisual = 0;

    function criarAudio(nomeArquivo) {
      const el = new Audio(`${baseSom}/${nomeArquivo}`);
      el.preload = 'auto';
      return el;
    }

    const sons = {
      mover: criarAudio('Move.mp3'),
      capturar: criarAudio('Capture.mp3')
    };

    function reproduzirSom(audioBase) {
      if (!audioBase) return;
      const copia = audioBase.cloneNode();
      copia.volume = 1;
      copia.play().catch(() => {});
    }

    function estaEmXeque(instancia = jogo) {
      if (typeof instancia.isCheck === 'function' && instancia.isCheck()) return true;
      if (typeof instancia.inCheck === 'function' && instancia.inCheck()) return true;

      if (typeof instancia.board === 'function' && typeof instancia.isAttacked === 'function') {
        const corAtual = instancia.turn();
        const inimigo = corAtual === 'w' ? 'b' : 'w';
        const colunas = 'abcdefgh';
        const tabuleiro = instancia.board();
        for (let linhaIdx = 0; linhaIdx < 8; linhaIdx++) {
          for (let colIdx = 0; colIdx < 8; colIdx++) {
            const casaObj = tabuleiro[linhaIdx][colIdx];
            if (casaObj && casaObj.type === 'k' && casaObj.color === corAtual) {
              const casaNome = `${colunas[colIdx]}${8 - linhaIdx}`;
              return instancia.isAttacked(casaNome, inimigo);
            }
          }
        }
      }
      return false;
    }

    function estaEmXequeMate(instancia = jogo) {
      if (typeof instancia.isCheckmate === 'function') return instancia.isCheckmate();
      if (typeof instancia.inCheckmate === 'function') return instancia.inCheckmate();
      return false;
    }

    function tocarSom(lance) {
      if (lance && lance.captured) {
        reproduzirSom(sons.capturar);
        return;
      }
      reproduzirSom(sons.mover);
    }

    function obterLancesLegais(instancia = jogo) {
      const dests = new Map();
      const colunas = 'abcdefgh';
      for (let c = 0; c < 8; c++) {
        for (let l = 1; l <= 8; l++) {
          const casa = `${colunas[c]}${l}`;
          const lances = instancia.moves({ square: casa, verbose: true });
          if (lances.length) {
            dests.set(casa, lances.map(l => l.to));
          }
        }
      }
      return dests;
    }

    function atualizarMaterialECapturas(instanciaVisual, ateIndice) {
      const valores = { p: 1, n: 3, b: 3, r: 5, q: 9 };
      const ordem = { q: 1, r: 2, b: 3, n: 4, p: 5 };
      const codigosImg = { p: 'P', n: 'N', b: 'B', r: 'R', q: 'Q' };

      const capturadasPelasBrancas = [];
      const capturadasPelasPretas = [];

      for (let i = 0; i < ateIndice; i++) {
        const lance = lancesHistorico[i];
        if (lance && lance.captured) {
          if (lance.color === 'w') capturadasPelasBrancas.push(lance.captured);
          else capturadasPelasPretas.push(lance.captured);
        }
      }

      capturadasPelasBrancas.sort((a, b) => ordem[a] - ordem[b]);
      capturadasPelasPretas.sort((a, b) => ordem[a] - ordem[b]);

      let pontosBrancas = 0;
      let pontosPretas = 0;
      for (const linha of instanciaVisual.board()) {
        for (const casa of linha) {
          if (casa && valores[casa.type]) {
            if (casa.color === 'w') pontosBrancas += valores[casa.type];
            else pontosPretas += valores[casa.type];
          }
        }
      }

      const diff = pontosBrancas - pontosPretas;
      const orientacao = cg ? cg.state.orientation : 'white';
      const topoEhPretas = orientacao === 'white';

      document.getElementById('nome-topo').textContent = topoEhPretas ? 'Pretas' : 'Brancas';
      document.getElementById('nome-base').textContent = topoEhPretas ? 'Brancas' : 'Pretas';

      const listaTopo = topoEhPretas ? capturadasPelasPretas : capturadasPelasBrancas;
      const corIconeTopo = topoEhPretas ? 'w' : 'b';
      const listaBase = topoEhPretas ? capturadasPelasBrancas : capturadasPelasPretas;
      const corIconeBase = topoEhPretas ? 'b' : 'w';

      document.getElementById('capturas-topo').innerHTML = listaTopo
        .map(p => `<img src="${basePeca}/${corIconeTopo}${codigosImg[p]}.svg" alt="${p}">`)
        .join('');

      document.getElementById('capturas-base').innerHTML = listaBase
        .map(p => `<img src="${basePeca}/${corIconeBase}${codigosImg[p]}.svg" alt="${p}">`)
        .join('');

      const vantagemTopo = document.getElementById('vantagem-topo');
      const vantagemBase = document.getElementById('vantagem-base');
      vantagemTopo.textContent = '';
      vantagemBase.textContent = '';

      if (diff > 0) {
        if (topoEhPretas) vantagemBase.textContent = `+${diff}`;
        else vantagemTopo.textContent = `+${diff}`;
      } else if (diff < 0) {
        if (topoEhPretas) vantagemTopo.textContent = `+${Math.abs(diff)}`;
        else vantagemBase.textContent = `+${Math.abs(diff)}`;
      }
    }

    function atualizarStatus(instanciaVisual) {
      if (estaEmXequeMate(instanciaVisual)) {
        statusEl.textContent = `Xeque-mate! Vitória das ${instanciaVisual.turn() === 'w' ? 'Pretas' : 'Brancas'}.`;
      } else if (typeof instanciaVisual.isDraw === 'function' && instanciaVisual.isDraw()) {
        statusEl.textContent = 'Empate!';
      } else {
        const vez = instanciaVisual.turn() === 'w' ? 'Brancas' : 'Pretas';
        const revisando = indiceVisual < lancesHistorico.length ? ' · Histórico' : '';
        statusEl.textContent = `Vez das ${vez}${estaEmXeque(instanciaVisual) ? ' (Xeque!)' : ''}${revisando}`;
      }
    }

    function atualizarControlesHistorico() {
      const total = lancesHistorico.length;
      contadorLanceEl.textContent = indiceVisual === 0
        ? (total === 0 ? 'Início' : `0 / ${total}`)
        : `${indiceVisual} / ${total}`;

      document.getElementById('btn-inicio').disabled = indiceVisual <= 0;
      document.getElementById('btn-voltar').disabled = indiceVisual <= 0;
      document.getElementById('btn-avancar').disabled = indiceVisual >= total;
      document.getElementById('btn-fim').disabled = indiceVisual >= total;
    }

    function renderizarPosicaoVisual(lanceExecutado = null) {
      const fenVisual = posicoesFen[indiceVisual];
      const instanciaVisual = new Chess(fenVisual);
      const lanceAnterior = indiceVisual > 0 ? lancesHistorico[indiceVisual - 1] : null;

      cg.set({
        fen: fenVisual,
        turnColor: instanciaVisual.turn() === 'w' ? 'white' : 'black',
        check: estaEmXeque(instanciaVisual),
        lastMove: lanceAnterior ? [lanceAnterior.from, lanceAnterior.to] : undefined,
        movable: {
          color: 'both',
          free: false,
          dests: obterLancesLegais(instanciaVisual)
        }
      });

      atualizarStatus(instanciaVisual);
      atualizarMaterialECapturas(instanciaVisual, indiceVisual);
      atualizarControlesHistorico();
      if (lanceExecutado) tocarSom(lanceExecutado);
    }

    function truncarParaIndiceVisual() {
      if (indiceVisual < lancesHistorico.length) {
        posicoesFen = posicoesFen.slice(0, indiceVisual + 1);
        lancesHistorico = lancesHistorico.slice(0, indiceVisual);
        jogo.load(posicoesFen[indiceVisual]);
      }
    }

    function registrarNovoLance(lance) {
      if (!lance) return;
      posicoesFen.push(jogo.fen());
      lancesHistorico.push(lance);
      indiceVisual = lancesHistorico.length;
      renderizarPosicaoVisual(lance);
    }

    function ehPromocao(orig, dest) {
      const peca = jogo.get(orig);
      if (!peca || peca.type !== 'p') return false;
      return (peca.color === 'w' && dest[1] === '8') || (peca.color === 'b' && dest[1] === '1');
    }

    function abrirMenuPromocao(orig, dest, cor) {
      const prefixo = cor === 'w' ? 'w' : 'b';
      const pecas = [
        { codigo: 'q', img: `${prefixo}Q`, nome: 'Dama' },
        { codigo: 'r', img: `${prefixo}R`, nome: 'Torre' },
        { codigo: 'b', img: `${prefixo}B`, nome: 'Bispo' },
        { codigo: 'n', img: `${prefixo}N`, nome: 'Cavalo' }
      ];

      opcoesPromocao.innerHTML = '';
      pecas.forEach(p => {
        const btn = document.createElement('div');
        btn.className = 'opcao-peca';
        btn.title = p.nome;
        btn.innerHTML = `<img src="${basePeca}/${p.img}.svg" alt="${p.nome}">`;
        btn.onclick = () => {
          modalPromocao.classList.remove('ativo');
          const lance = jogo.move({ from: orig, to: dest, promotion: p.codigo });
          registrarNovoLance(lance);
        };
        opcoesPromocao.appendChild(btn);
      });

      modalPromocao.classList.add('ativo');
    }

    const cg = Chessground(document.getElementById('tabuleiro'), {
      movable: {
        color: 'both',
        free: false,
        dests: obterLancesLegais()
      },
      drawable: {
        enabled: true,
        visible: true
      },
      events: {
        move: (orig, dest) => {
          if (indiceVisual < lancesHistorico.length) {
            truncarParaIndiceVisual();
          }

          if (ehPromocao(orig, dest)) {
            abrirMenuPromocao(orig, dest, jogo.turn());
            return;
          }
          const lance = jogo.move({ from: orig, to: dest });
          if (!lance) {
            renderizarPosicaoVisual(null);
            return;
          }
          registrarNovoLance(lance);
        }
      }
    });

    window.irParaIndice = (novoIndice) => {
      modalPromocao.classList.remove('ativo');
      const limite = lancesHistorico.length;
      const alvo = Math.max(0, Math.min(limite, novoIndice));
      if (alvo === indiceVisual) return;
      indiceVisual = alvo;
      renderizarPosicaoVisual(null);
    };

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') {
        e.preventDefault();
        window.irParaIndice(indiceVisual - 1);
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        window.irParaIndice(indiceVisual + 1);
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        window.irParaIndice(0);
      } else if (e.key === 'ArrowDown') {
        e.preventDefault();
        window.irParaIndice(lancesHistorico.length);
      } else if (e.key.toLowerCase() === 'x') {
        window.inverterTabuleiro();
      }
    });

    window.reiniciarJogo = () => {
      modalPromocao.classList.remove('ativo');
      jogo.reset();
      posicoesFen = [jogo.fen()];
      lancesHistorico = [];
      indiceVisual = 0;
      cg.set({
        fen: jogo.fen(),
        turnColor: 'white',
        check: false,
        lastMove: undefined,
        drawable: { shapes: [] },
        movable: {
          color: 'both',
          dests: obterLancesLegais()
        }
      });
      atualizarStatus(jogo);
      atualizarMaterialECapturas(jogo, 0);
      atualizarControlesHistorico();
    };

    window.inverterTabuleiro = () => {
      cg.toggleOrientation();
      renderizarPosicaoVisual(null);
    };

    atualizarControlesHistorico();
  </script>

</body>
</html>
