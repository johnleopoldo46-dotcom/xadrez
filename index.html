<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Teste Stockfish - Leopoldóvia</title>
  <style>
    body {
      background: #161512;
      color: #d6d3ce;
      font-family: system-ui, sans-serif;
      padding: 24px;
    }
    button {
      background: #363431;
      color: #fff;
      border: 1px solid #4a4743;
      padding: 8px 14px;
      border-radius: 4px;
      cursor: pointer;
      margin-right: 8px;
    }
    #log {
      margin-top: 16px;
      background: #211f1c;
      border: 1px solid #36332f;
      padding: 12px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 13px;
      white-space: pre-wrap;
      max-height: 360px;
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <h2>Teste de carregamento do Stockfish</h2>
  <button id="btn-testar">Iniciar Teste</button>
  <button id="btn-lance">Pedir Lance Teste (1. e4)</button>
  <div id="log">Aguardando clique em "Iniciar Teste"...</div>

  <script>
    const logEl = document.getElementById('log');
    let worker = null;

    // Candidatos leves/clássicos via CDN para testar carregamento no navegador
    const CANDIDATOS = [
      'https://cdn.jsdelivr.net/npm/stockfish.js@10.0.2/stockfish.js',
      'https://unpkg.com/stockfish.js@10.0.2/stockfish.js'
    ];

    function escreverLog(msg) {
      console.log('[SF-TESTE]', msg);
      logEl.textContent += `\n${msg}`;
      logEl.scrollTop = logEl.scrollHeight;
    }

    async function criarWorkerViaBlob(url) {
      const resp = await fetch(url);
      if (!resp.ok) throw new Error(`HTTP ${resp.status} em ${url}`);
      const codigo = await resp.text();
      const blob = new Blob([codigo], { type: 'application/javascript' });
      const blobUrl = URL.createObjectURL(blob);
      const w = new Worker(blobUrl);
      URL.revokeObjectURL(blobUrl);
      return w;
    }

    document.getElementById('btn-testar').addEventListener('click', async () => {
      logEl.textContent = 'Testando fontes do Stockfish...';
      if (worker) {
        worker.terminate();
        worker = null;
      }

      for (const url of CANDIDATOS) {
        try {
          escreverLog(`Tentando carregar: ${url}`);
          worker = await criarWorkerViaBlob(url);

          worker.onmessage = (e) => {
            escreverLog(`Motor -> ${typeof e.data === 'string' ? e.data : JSON.stringify(e.data)}`);
          };
          worker.onerror = (err) => {
            escreverLog(`Erro no Worker: ${err.message || err}`);
          };

          worker.postMessage('uci');
          worker.postMessage('isready');
          escreverLog('Comandos "uci" e "isready" enviados!');
          return;
        } catch (err) {
          escreverLog(`Falhou (${url}): ${err.message}`);
        }
      }

      escreverLog('Nenhuma das URLs testadas carregou.');
    });

    document.getElementById('btn-lance').addEventListener('click', () => {
      if (!worker) {
        escreverLog('Inicie o teste primeiro.');
        return;
      }
      escreverLog('Calculando lance na posição inicial após 1. e4 (depth 6)...');
      worker.postMessage('position startpos moves e2e4');
      worker.postMessage('go depth 6');
    });
  </script>
</body>
</html>
